name: carservice_business
description: "Carservice Business — авто засварын газрын ажилтны апп."

version: 1.0.2+3

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.11.1
  jwt_decoder: ^2.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_dotenv: ^6.0.1
  fl_chart: ^1.2.0
  intl: ^0.20.3
  image_picker: ^1.2.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2
  go_router: 18.0.1
  share_plus: ^12.0.1
  get: ^4.7.3
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "asset/icons/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_foreground: "asset/icons/app_icon_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:

  uses-material-design: true

  assets:
    - .env
    - asset/icons/logo.png

  fonts:
   
    - family: IBM Plex Sans
      fonts:
        - asset: asset/fonts/IBMPlexSans/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: asset/fonts/IBMPlexSans/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: asset/fonts/IBMPlexSans/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: asset/fonts/IBMPlexSans/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: asset/fonts/IBMPlexMono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: asset/fonts/IBMPlexMono/IBMPlexMono-Medium.ttf
          weight: 500